# yazi.toml

[mgr]
show_hidden    = true
scrolloff      = 10

[opener]
edit = [
    { run = "${EDITOR:-nvim} %s", desc = "$EDITOR", for = "unix", block = true },
    { run = "nvim %s",          desc = "nvim",    for = "windows", block = true },
]

[[plugin.prepend_fetchers]]
url    = "*"
run    = "git"
group  = "git"

[[plugin.prepend_fetchers]]
url    = "*/"
run    = "git"
group  = "git"
