# Starship Configuration

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'
# New Line after a command
add_newline = true
# Command timeout of 5 Sec
command_timeout = 5000
# Selection from available 'palettes'
palette = "catppuccin_macchiato"
# Follows symlinks to check if they're directories; used in modules such as git.
follow_symlinks = true
# Main Format for the prompt
format = """\
╭─ ($username$hostname⟾   )$directory$git_branch$git_commit$git_status$kubernetes$docker_context$nodejs$python
╰──$jobs$sudo$status$character \
"""

# Shows the username
[username]
# show_always = true
style_user = 'sapphire bold'
style_root = 'red bold'
format = '[($user) ]($style)'
disabled = false

# Shows the hostname
[hostname]
# ssh_only = false
format = '[([@]() $hostname)( $ssh_symbol) ](bold yellow)'
disabled = false

# Shows current directory
[directory]
use_os_path_sep = true
fish_style_pwd_dir_length = 2
home_symbol = '󰋜 ~'
read_only_style = '197'
read_only = '  '
format = '[$path]($style)[$read_only]($read_only_style) '
disabled = false

# Shows job status
[jobs]
format = '[ $symbol$number]($style) '
disabled = false

# Shows sudo cache state
[sudo]
allow_windows = true
format = '[ $symbol]($style)'
disabled = false

# Shows last command's status
[status]
format = '[ $symbol $status]($style) '
disabled = false

# Show indicator - Last command status and vim mode
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[⏸](bold green)'
disabled = false

# Shows current git branch
[git_branch]
symbol = ' '
format = 'via [$symbol$branch]($style) '
disabled = false

# Shows current git commit
[git_commit]
commit_hash_length = 9
disabled = false

# Shows current git status
[git_status]
conflicted = '🏳'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
up_to_date = ''
untracked = '？'
stashed = '🖫 '
modified = ' '
staged = '[++\($count\)](green)'
renamed = 'R+'
deleted = ' '
disabled = false

# ---

# Shows kubernetes context and namespace
[kubernetes]
format = 'via [󱃾 $context\($namespace\)](bold purple) '
disabled = false

# Shows docker context and namespace
[docker_context]
symbol = '🐳 '
style = 'blue bold'
format = 'via [$symbol$context]($style) '
only_with_files = true
disabled = false
detect_extensions = []
detect_files = [
    'docker-compose.yml',
    'docker-compose.yaml',
    'Dockerfile',
]
detect_folders = []

# Shows python project and version
[python]
symbol = " "
#pyenv_version_name = true
format = 'via [${symbol}python (${version} )(\($virtualenv\) )]($style)'
style = "bold yellow"
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

# Shows nodejs project and version
[nodejs]
format = "via [ Node.js $version](bold green) "
detect_files = ["package.json", ".node-version"]
detect_folders = ["node_modules"]

# ---

[vagrant]
disabled = true

[helm]
disabled = true

[ruby]
disabled = true

[terraform]
disabled = true

